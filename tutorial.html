<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tutorial</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="h-screen flex items-center justify-center bg-black text-white">
  <audio id="bgMusic" loop>
    <source src="assets/audio/musica-principal.mp3" type="audio/mpeg">
  </audio>

  <div class="text-center">
    <h1 class="title mb-6">TUTORIAL</h1>

    <p class="mb-6">
      Aqui vai o conteúdo do tutorial do jogo.
    </p>

    <a href="index.html" class="menu-btn inline-block">
      VOLTAR
    </a>
  </div>
  <script>
    const music = document.getElementById('bgMusic');
  
    function startMusic() {
      if (music.paused) {
        music.play()
          .then(() => {
            console.log("Música tocando!");
          })
          .catch(err => {
            console.log("Erro ao tocar:", err);
          });
      }
    }
  
    // Garante interação válida
    document.addEventListener('click', startMusic);
    document.addEventListener('keydown', startMusic);
  </script>

</body>
</html>
